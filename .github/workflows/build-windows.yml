name: Build Windows demo

on:
  push:
    branches: [main]
    paths:
      - "prank_demo.c"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        shell: pwsh
        run: cl /nologo /W4 /O2 /DUNICODE /D_UNICODE prank_demo.c user32.lib /link /SUBSYSTEM:WINDOWS /out:prank_demo.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: prank-demo-windows
          path: prank_demo.exe
          if-no-files-found: error
